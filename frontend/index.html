<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover is REQUIRED or every env(safe-area-inset-*) resolves to 0, and
     in standalone mode the notch and home indicator eat the nav. -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#e9e4d6">
<title>MeowMap</title>

<!-- iOS does not reliably take the home-screen glyph from the manifest icons array,
     so the legacy tags stay alongside it. -->
<link rel="manifest" href="./manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MeowMap">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon-180.png">
<link rel="icon" href="./icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=Kalam:wght@400;700&family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<link rel="stylesheet" href="./styles/tokens.css">
<link rel="stylesheet" href="./styles/base.css">
<link rel="stylesheet" href="./styles/layout.css">
<link rel="stylesheet" href="./styles/sticker.css">
<link rel="stylesheet" href="./styles/map.css">
<link rel="stylesheet" href="./styles/sheet.css">
<link rel="stylesheet" href="./styles/capture.css">
</head>
<body>

<div id="app">
  <header class="topbar">
    <span class="wordmark" id="wordmark">MeowMap</span>
    <!-- Drawn, not &#9881;. iOS renders that codepoint as a full-colour emoji, which is
         the one thing on this page that could not look less like ink on paper.

         TEETH ON A RIM, not spokes from the centre. The first drawn version was a small
         circle with eight lines radiating out of it, which is a sun — the gear reads only
         when the tooth stubs sit outside a closed rim and the hub is a hole. -->
    <button class="cog" id="cog" type="button" aria-label="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M10.25 4.71 L10.68 1.89 L13.32 1.89 L13.75 4.71 L15.92 5.61 L18.22 3.92
                 L20.08 5.78 L18.39 8.08 L19.29 10.25 L22.11 10.68 L22.11 13.32 L19.29 13.75
                 L18.39 15.92 L20.08 18.22 L18.22 20.08 L15.92 18.39 L13.75 19.29 L13.32 22.11
                 L10.68 22.11 L10.25 19.29 L8.08 18.39 L5.78 20.08 L3.92 18.22 L5.61 15.92
                 L4.71 13.75 L1.89 13.32 L1.89 10.68 L4.71 10.25 L5.61 8.08 L3.92 5.78
                 L5.78 3.92 L8.08 5.61 Z"/>
        <circle cx="12" cy="12" r="3.5"/>
      </svg>
    </button>
  </header>

  <main class="stage" id="stage">
    <section class="screen live" id="s-map" aria-label="Map"></section>
    <section class="screen hide ruled" id="s-snap" aria-label="Add a cat"></section>
    <section class="screen hide ruled" id="s-cats" aria-label="Cats"></section>

    <!-- The detail layer. A sibling of the tab screens rather than a fourth tab: it
         slides UP over whichever tab is showing, so hierarchy never looks like lateral
         movement. It stops short of the top edge on purpose — the strip of the page
         behind it is what tells you it is a sheet you can push back down. -->
    <!-- The exposed strip above the sheet. Dismisses on tap, like a backdrop. -->
    <div class="detail-veil" id="detail-veil"></div>

    <section class="screen detail hide" id="s-detail" role="region">
      <div class="grab" id="detailGrab"><i></i></div>
      <div class="detail-body" id="s-detail-body"></div>
    </section>
  </main>

  <div class="veil" id="veil"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Details"></div>

  <nav class="tabs" id="tabs" aria-label="Primary">
    <button class="t1" data-screen="map"  aria-current="page">Map</button>
    <button class="t2" data-screen="snap">Snap</button>
    <button class="t3" data-screen="cats">Cats</button>
  </nav>
</div>

<!-- Leaflet is a classic script and must define the L global before main.js runs.
     Never import it as a module; that is the house convention. -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="./app/main.js"></script>
</body>
</html>
