<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meowmap — sticker pop</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --sheet:#fffbf2; --sheet-2:#fff;
  /* aubergine, not black: reads as printed vinyl rather than a template */
  --ink:#3b2a45; --ink-soft:#7a6a83; --ink-faint:#a99cb0;
  --coral:#ff5470; --marigold:#ffc145; --jade:#3dbe8b; --peri:#7c8cff;
  --r-sm:8px; --r-md:14px; --r-lg:20px; --r-pill:999px;
  --t-xs:11px; --t-sm:13px; --t-md:15px; --t-lg:18px; --t-xl:23px; --t-2xl:30px;
  --pop:3px 3px 0 var(--ink);
  --pop-sm:2px 2px 0 var(--ink);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  background:#2b1f33;
  font-family:'Outfit',system-ui,sans-serif;
  color:var(--ink);
  padding:32px 16px 64px;
}
.brief{max-width:1180px;margin:0 auto 28px;color:#e8dff0}
.brief h1{font-family:'Baloo 2',cursive;font-size:var(--t-2xl);font-weight:800;letter-spacing:-.01em}
.brief p{font-size:var(--t-md);max-width:64ch;margin-top:6px;color:#b6a6c0;line-height:1.55}
.sheet{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:34px;justify-content:center}
.frame{width:390px;max-width:100%}
.frame > figcaption{font-size:var(--t-md);font-weight:600;color:#c9bad2;margin-bottom:8px;padding-left:4px}
.phone{
  height:720px;border-radius:26px;overflow:hidden;position:relative;
  background:var(--sheet);
  box-shadow:0 18px 40px rgba(0,0,0,.5);
  display:flex;flex-direction:column;
  /* sticker backing sheet */
  background-image:radial-gradient(var(--ink-faint) 1px,transparent 1px);
  background-size:16px 16px;
}
.topbar{
  flex:0 0 auto;padding:13px 16px;background:var(--sheet-2);
  border-bottom:3px solid var(--ink);display:flex;align-items:center;gap:9px;
}
.wordmark{font-family:'Baloo 2',cursive;font-size:var(--t-xl);font-weight:800;letter-spacing:-.02em}
.place{font-size:var(--t-sm);font-weight:500;color:var(--ink-soft);margin-left:auto}
.body{flex:1 1 auto;overflow:hidden;position:relative}
.scroll{height:100%;overflow:hidden;padding:15px 16px 0}
.tabs{flex:0 0 auto;display:flex;gap:8px;padding:10px 12px 14px;background:var(--sheet-2);border-top:3px solid var(--ink)}
.tabs button{
  flex:1;font-family:'Baloo 2',cursive;font-size:var(--t-md);font-weight:700;
  border:2.5px solid var(--ink);background:var(--sheet);color:var(--ink);
  padding:8px 0;border-radius:var(--r-pill);cursor:pointer;
}
.tabs button.on{background:var(--marigold);box-shadow:var(--pop-sm)}

/* ── map ─────────────────────────────────────────── */
#map{position:absolute;inset:0}
/* flatten the basemap so the candy pins carry all the colour */
.leaflet-tile-pane{filter:saturate(.42) brightness(1.1) contrast(.86)}
.leaflet-container{background:var(--sheet)}
.leaflet-control-attribution{font-family:'Outfit',sans-serif;font-size:9px;background:rgba(255,251,242,.85)}
.pin{background:none;border:0}
.pin i{
  display:block;width:48px;height:48px;border-radius:50%;
  border:3px solid var(--ink);outline:3px solid #fff;
  background:#fff center/cover no-repeat;box-shadow:var(--pop);
}
.pin::after{
  content:'';position:absolute;left:50%;bottom:-9px;
  border:7px solid transparent;border-top:11px solid var(--ink);
  transform:translateX(-50%);
}
.pin b{
  position:absolute;right:-10px;top:-6px;
  font-family:'Baloo 2',cursive;font-size:var(--t-xs);font-weight:800;
  background:var(--coral);color:#fff;border:2.5px solid var(--ink);
  padding:0 6px;border-radius:var(--r-pill);box-shadow:var(--pop-sm);
}
.pin.loose i{border-style:dashed;filter:grayscale(.6);box-shadow:none}
.pin.pending i{outline-color:var(--marigold)}
.pin.pending b{background:var(--marigold);color:var(--ink)}
.maptip{
  position:absolute;left:14px;right:14px;bottom:14px;z-index:600;
  background:var(--sheet-2);border:2.5px solid var(--ink);border-radius:var(--r-md);
  padding:10px 13px;font-size:var(--t-sm);color:var(--ink-soft);box-shadow:var(--pop);
}
.maptip strong{color:var(--ink);font-weight:700}

/* ── die-cut sticker card ────────────────────────── */
.sticker{
  background:var(--sheet-2);border:3px solid var(--ink);border-radius:var(--r-lg);
  box-shadow:var(--pop);padding:12px;margin-bottom:15px;
}
.photo{
  display:block;width:100%;height:194px;object-fit:cover;
  border:3px solid var(--ink);border-radius:var(--r-md);
}
.title{font-family:'Baloo 2',cursive;font-size:var(--t-xl);font-weight:800;line-height:1.1;margin-top:11px}
.sub{font-size:var(--t-sm);font-weight:500;color:var(--ink-soft);margin-top:1px}
.rows{margin-top:10px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:var(--t-sm)}
.rows dt{color:var(--ink-faint);font-weight:500}
.rows dd{font-weight:600}

/* ── chips ───────────────────────────────────────── */
.chiprow{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
.chip{
  font-family:'Outfit',sans-serif;font-size:var(--t-sm);font-weight:600;
  border:2.5px solid var(--ink-faint);color:var(--ink-soft);background:var(--sheet-2);
  padding:5px 12px;border-radius:var(--r-pill);cursor:pointer;
}
.chip.on{border-color:var(--ink);color:var(--ink);box-shadow:var(--pop-sm)}
.chip.on.c1{background:var(--marigold)}
.chip.on.c2{background:var(--coral);color:#fff}
.chip.on.c3{background:var(--jade)}
.fieldname{font-size:var(--t-sm);font-weight:700;color:var(--ink);margin-top:13px}

/* petted is a badge you earned */
.badge{
  position:absolute;right:22px;top:168px;z-index:5;
  font-family:'Baloo 2',cursive;font-size:var(--t-md);font-weight:800;
  background:var(--jade);color:var(--ink);border:3px solid var(--ink);
  padding:5px 13px;border-radius:var(--r-pill);box-shadow:var(--pop);
  transform:rotate(-8deg);
}

/* ── cats list ───────────────────────────────────── */
.cat{
  display:flex;gap:12px;align-items:center;background:var(--sheet-2);
  border:2.5px solid var(--ink);border-radius:var(--r-md);
  box-shadow:var(--pop-sm);padding:9px;margin-bottom:10px;
}
.cat img{width:52px;height:52px;object-fit:cover;border-radius:50%;border:2.5px solid var(--ink)}
.cat .nm{font-family:'Baloo 2',cursive;font-size:var(--t-lg);font-weight:700;line-height:1.15}
.cat .mt{font-size:var(--t-sm);color:var(--ink-soft)}
.cat .ct{margin-left:auto;font-size:var(--t-xs);font-weight:700;border:2px solid var(--ink);
  border-radius:var(--r-pill);padding:2px 8px}
.swatch{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px;
  border:1.5px solid var(--ink);vertical-align:0}

/* ── suggestion ──────────────────────────────────── */
.ask h3{font-family:'Baloo 2',cursive;font-size:var(--t-lg);font-weight:800}
.ask .hint{font-size:var(--t-sm);color:var(--ink-soft);margin-top:1px}
.cand{display:flex;gap:11px;align-items:center;margin-top:11px;
  border:2.5px solid var(--ink);border-radius:var(--r-md);padding:8px;background:var(--sheet)}
.cand img{width:50px;height:50px;object-fit:cover;border-radius:50%;border:2.5px solid var(--ink)}
.cand .nm{font-family:'Baloo 2',cursive;font-size:var(--t-md);font-weight:700}
.cand .why{font-size:var(--t-sm);color:var(--ink-soft);line-height:1.3}
.cand button{margin-left:auto;font-family:'Baloo 2',cursive;font-size:var(--t-sm);font-weight:800;
  border:2.5px solid var(--ink);background:var(--jade);color:var(--ink);
  padding:6px 15px;border-radius:var(--r-pill);cursor:pointer;box-shadow:var(--pop-sm)}
.ghost{display:block;width:100%;margin-top:12px;font-family:'Baloo 2',cursive;
  font-size:var(--t-md);font-weight:700;
  border:2.5px dashed var(--ink-faint);background:none;color:var(--ink-soft);
  padding:9px;border-radius:var(--r-pill);cursor:pointer}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="brief">
  <h1>Direction 2 — sticker pop</h1>
  <p>A sheet of vinyl stickers. Every card is die-cut with a kiss-cut white ring and a hard offset shadow. Outlines are aubergine rather than black, which reads as printed sticker instead of the usual heavy-border web look. Colour is loud on the pins and quiet everywhere else.</p>
</div>

<div class="sheet">

  <figure class="frame">
    <figcaption>1. Map</figcaption>
    <div class="phone">
      <div class="topbar"><span class="wordmark">Meowmap</span><span class="place">Fernwood, Victoria</span></div>
      <div class="body">
        <div id="map"></div>
        <div class="maptip"><strong>Mochi</strong> has turned up three times on this block since April.</div>
      </div>
      <nav class="tabs"><button class="on">Map</button><button>Snap</button><button>Cats</button></nav>
    </div>
  </figure>

  <figure class="frame">
    <figcaption>2. One sighting</figcaption>
    <div class="phone">
      <div class="topbar"><span class="wordmark">Mochi</span><span class="place">third sighting</span></div>
      <div class="body"><div class="scroll">
        <div class="badge">petted!</div>
        <div class="sticker">
          <img class="photo" src="https://placecats.com/neo/600/420" alt="A cat on a fence">
          <div class="title">Mochi</div>
          <div class="sub">Moss Street at Fernwood Road</div>
          <dl class="rows">
            <dt>Seen</dt><dd>14 August, 6:42pm</dd>
            <dt>Location</dt><dd>from the photo</dd>
          </dl>
          <div class="fieldname">Coat</div>
          <div class="chiprow">
            <button class="chip on c1">orange</button><button class="chip on c2">tabby</button>
            <button class="chip">black</button><button class="chip">white</button>
            <button class="chip">grey</button><button class="chip">tuxedo</button>
            <button class="chip">calico</button>
          </div>
          <div class="fieldname">Size</div>
          <div class="chiprow">
            <button class="chip">kitten</button><button class="chip on c3">adult</button><button class="chip">chonk</button>
          </div>
        </div>
      </div></div>
      <nav class="tabs"><button>Map</button><button>Snap</button><button class="on">Cats</button></nav>
    </div>
  </figure>

  <figure class="frame">
    <figcaption>3. Cats</figcaption>
    <div class="phone">
      <div class="topbar"><span class="wordmark">Cats</span><span class="place">nine so far</span></div>
      <div class="body"><div class="scroll">
        <div class="cat"><img src="https://placecats.com/neo/160/160" alt="">
          <div><div class="nm"><span class="swatch" style="background:#ff5470"></span>Mochi</div><div class="mt">Moss Street, three sightings</div></div><div class="ct">petted</div></div>
        <div class="cat"><img src="https://placecats.com/millie/160/160" alt="">
          <div><div class="nm"><span class="swatch" style="background:#3dbe8b"></span>Gravy</div><div class="mt">Cook Street, twice</div></div><div class="ct">not yet</div></div>
        <div class="cat"><img src="https://placecats.com/bella/160/160" alt="">
          <div><div class="nm"><span class="swatch" style="background:#7c8cff"></span>Sergeant Tuxedo</div><div class="mt">Oak Bay Avenue, once</div></div><div class="ct">fled</div></div>
        <div class="cat"><img src="https://placecats.com/poppy/160/160" alt="">
          <div><div class="nm"><span class="swatch" style="background:#ffc145"></span>Biscuit</div><div class="mt">Pandora Avenue, once</div></div><div class="ct">petted</div></div>
        <div class="cat"><img src="https://placecats.com/louie/160/160" alt="">
          <div><div class="nm" style="color:var(--ink-soft)">Not named yet</div><div class="mt">the one under the Subaru</div></div><div class="ct">once</div></div>
      </div></div>
      <nav class="tabs"><button>Map</button><button>Snap</button><button class="on">Cats</button></nav>
    </div>
  </figure>

  <figure class="frame">
    <figcaption>4. Just after saving</figcaption>
    <div class="phone">
      <div class="topbar"><span class="wordmark">Saved</span><span class="place">one moment</span></div>
      <div class="body"><div class="scroll">
        <div class="sticker">
          <img class="photo" src="https://placecats.com/louie/600/380" alt="A cat photographed just now" style="height:148px">
        </div>
        <div class="sticker ask">
          <h3>Have you met this one before?</h3>
          <div class="hint">Two cats have been seen near here.</div>
          <div class="cand"><img src="https://placecats.com/neo/160/160" alt="">
            <div><div class="nm">Mochi</div><div class="why">40 metres away, three days ago</div></div>
            <button>Yes</button></div>
          <div class="cand"><img src="https://placecats.com/millie/160/160" alt="">
            <div><div class="nm">Gravy</div><div class="why">180 metres away, last month</div></div>
            <button>Yes</button></div>
          <button class="ghost">Someone new</button>
        </div>
      </div></div>
      <nav class="tabs"><button class="on">Map</button><button>Snap</button><button>Cats</button></nav>
    </div>
  </figure>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map',{zoomControl:false,attributionControl:true,preferCanvas:true})
  .setView([48.4266,-123.3505],15);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
  {attribution:'&copy; OpenStreetMap',maxZoom:19}).addTo(map);

function pin(img,{count=null,cls=''}={}){
  return L.divIcon({
    className:'pin '+cls,
    html:'<i style="background-image:url('+img+')"></i>'+(count?'<b>'+count+'</b>':''),
    iconSize:[48,48], iconAnchor:[24,60]
  });
}
const mochiPts=[[48.4278,-123.3535],[48.4271,-123.3498],[48.4262,-123.3521]];
const gravyPts=[[48.4249,-123.3480],[48.4256,-123.3455]];

L.polyline(mochiPts,{color:'#ff5470',weight:3.5,dashArray:'7 6',opacity:.95,interactive:false}).addTo(map);
L.polyline(gravyPts,{color:'#3dbe8b',weight:3.5,dashArray:'7 6',opacity:.95,interactive:false}).addTo(map);

L.marker(mochiPts[0],{icon:pin('https://placecats.com/neo/120/120')}).addTo(map);
L.marker(mochiPts[1],{icon:pin('https://placecats.com/neo/120/120')}).addTo(map);
L.marker(mochiPts[2],{icon:pin('https://placecats.com/neo/120/120',{count:'x2'})}).addTo(map);
L.marker(gravyPts[0],{icon:pin('https://placecats.com/millie/120/120')}).addTo(map);
L.marker(gravyPts[1],{icon:pin('https://placecats.com/millie/120/120')}).addTo(map);
L.marker([48.4288,-123.3472],{icon:pin('https://placecats.com/bella/120/120')}).addTo(map);
L.marker([48.4240,-123.3540],{icon:pin('https://placecats.com/poppy/120/120',{cls:'loose'})}).addTo(map);
L.marker([48.4295,-123.3505],{icon:pin('https://placecats.com/louie/120/120',{cls:'pending',count:'!'})}).addTo(map);
</script>
</body>
</html>
